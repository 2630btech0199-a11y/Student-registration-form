<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            max-width: 750px;
            width: 100%;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        fieldset {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fafafa;
        }

        legend {
            font-weight: 600;
            color: #16a085;
            padding: 0 8px;
            font-size: 1.05rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        /* Two column layout for grid fields */
        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #444;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: border-color 0.2s ease-in-out;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            border-color: #16a085;
            outline: none;
            background-color: #fff;
        }

        textarea {
            resize: vertical;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-group label,
        .checkbox-group label {
            display: inline;
            font-weight: normal;
            cursor: pointer;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 6px;
            accent-color: #16a085;
            cursor: pointer;
        }

        input[type="file"] {
            padding: 5px 0;
            font-size: 0.9rem;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }

        button[type="submit"] {
            background-color: #16a085;
            color: white;
        }

        button[type="submit"]:hover {
            background-color: #117a65;
        }

        button[type="reset"] {
            background-color: #e74c3c;
            color: white;
        }

        button[type="reset"]:hover {
            background-color: #c0392b;
        }

        /* Responsive layout for smaller screens */
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUMRNWrbkDZWr6l1XC_bmQ7ViY1huHRxM_hTitOChTMA&s=10" height="300" alt="The dream university" title="DREAM OF STUDENTS">

    <div class="container">
        <h2>KIET DEEMED TO BE UNIVERSITY</h2>
        <p class="subtitle">Please complete all required fields and upload your documents.</p>

        <form action="/submit-admission" method="POST" enctype="multipart/form-data">
            
            <!-- 1. Personal Information -->
            <fieldset>
                <legend>1. Personal Information</legend>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fname">First Name:</label>
                        <input type="text" id="fname" name="first_name" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label for="lname">Last Name:</label>
                        <input type="text" id="lname" name="last_name" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label>Gender:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="Male" required> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                </div>
            </fieldset>

            <!-- 2. Contact Details -->
            <fieldset>
                <legend>2. Contact Details</legend>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" placeholder="9876543210" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Permanent Address:</label>
                    <textarea id="address" name="address" rows="3" placeholder="Enter full address..." required></textarea>
                </div>
            </fieldset>

            <!-- 3. Category & Reservation Details -->
            <fieldset>
                <legend>3. Category & Reservation</legend>

                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" name="category" required>
                        <option value="">-- Select Category --</option>
                        <option value="general">General / UR</option>
                        <option value="obc">OBC (Other Backward Classes)</option>
                        <option value="sc">SC (Scheduled Caste)</option>
                        <option value="st">ST (Scheduled Tribe)</option>
                        <option value="ews">EWS (Economically Weaker Section)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="caste_cert">Upload Caste / Category Certificate (PDF/Image):</label>
                    <input type="file" id="caste_cert" name="caste_certificate" accept=".pdf, image/*">
                </div>
            </fieldset>

            <!-- 4. Academic Performance & Entrance Exams -->
            <fieldset>
                <legend>4. Academic Details & Scores</legend>

                <div class="form-group">
                    <label for="course">Course Applying For:</label>
                    <select id="course" name="course" required>
                        <option value="">-- Select Course --</option>
                        <option value="btech">B.Tech (Engineering)</option>
                        <option value="bca">BCA (Computer Applications)</option>
                        <option value="bsc">B.Sc (Science)</option>
                        <option value="bcom">B.Com (Commerce)</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="marks_12th">12th Grade Percentage / Marks:</label>
                        <input type="number" id="marks_12th" name="marks_12th" min="0" max="100" step="0.01" placeholder="e.g., 88.5" required>
                    </div>
                    <div class="form-group">
                        <label for="marksheet">Upload 12th Marksheet (PDF):</label>
                        <input type="file" id="marksheet" name="student_marksheet" accept=".pdf" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="jee_score">JEE Main NTA Score / Percentile:</label>
                        <input type="number" id="jee_score" name="jee_score" min="0" max="100" step="0.0000001" placeholder="e.g., 95.42">
                    </div>
                    <div class="form-group">
                        <label for="cbt_score">College Entrance Test (CBT) Score:</label>
                        <input type="number" id="cbt_score" name="cbt_score" min="0" placeholder="e.g., 140">
                    </div>
                </div>
            </fieldset>

            <!-- 5. Declaration -->
            <fieldset>
                <legend>5. Declaration</legend>
                <div class="form-group checkbox-group">
                    <label for="declaration">
                        <input type="checkbox" id="declaration" name="declaration" required>
                        I declare that all the details and certificates submitted above are accurate and valid.
                    </label>
                </div>
            </fieldset>

            <!-- Form Action Buttons -->
            <div class="btn-group">
                <button type="submit">Submit Application</button>
                <button type="reset">Reset Form</button>
            </div>

        </form>
    </div>

</body>
</html>
