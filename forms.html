<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Form</title>
</head>
<body>

    <h2>College Admission Form</h2>
    <p>Please fill out the form carefully to register for admission.</p>

    <form action="/submit-admission" method="POST" enctype="multipart/form-data">
        
        <!-- Personal Information Section -->
        <fieldset>
            <legend><strong>1. Personal Information</strong></legend>

            <p>
                <label for="fname">First Name:</label><br>
                <input type="text" id="fname" name="first_name" placeholder="John" required>
            </p>

            <p>
                <label for="lname">Last Name:</label><br>
                <input type="text" id="lname" name="last_name" placeholder="Doe" required>
            </p>

            <p>
                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob" required>
            </p>

            <p>
                <label>Gender:</label><br>
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>
            </p>
        </fieldset>

        <br>

        <!-- Contact Information Section -->
        <fieldset>
            <legend><strong>2. Contact Details</strong></legend>

            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </p>

            <p>
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" placeholder="123-456-7890" required>
            </p>

            <p>
                <label for="address">Address:</label><br>
                <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter full address..." required></textarea>
            </p>
        </fieldset>

        <br>

        <!-- Academic Information Section -->
        <fieldset>
            <legend><strong>3. Academic Information</strong></legend>

            <p>
                <label for="course">Select Course Applying For:</label><br>
                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="btech">B.Tech (Engineering)</option>
                    <option value="bca">BCA (Computer Applications)</option>
                    <option value="bsc">B.Sc (Science)</option>
                    <option value="bcom">B.Com (Commerce)</option>
                    <option value="ba">B.A (Arts)</option>
                </select>
            </p>

            <p>
                <label for="marks">12th Grade Percentage / GPA:</label><br>
                <input type="number" id="marks" name="marks" min="0" max="100" step="0.01" placeholder="e.g., 85.5" required>
            </p>

            <p>
                <label for="photo">Upload Passport Size Photo:</label><br>
                <input type="file" id="photo" name="student_photo" accept="image/*" required>
            </p>

            <p>
                <label for="marksheet">Upload 12th Marksheet (PDF):</label><br>
                <input type="file" id="marksheet" name="student_marksheet" accept=".pdf" required>
            </p>
            <p>
                <label for="marksheet">Uplaod Jee amrksheet(PDF):</label><br>
                <input type="file" id="marksheet" name="student_jeemarks" accept="pdf" required>
            </p>
        </fieldset>

        <br>

        <!-- Declaration & Submission -->
        <fieldset>
            <legend><strong>4. Declaration</strong></legend>
            <p>
                <input type="checkbox" id="declaration" name="declaration" required>
                <label for="declaration">I declare that all the information provided above is true to the best of my knowledge.</label>
            </p>
        </fieldset>

        <br>

        <!-- Buttons -->
        <button type="submit">Submit Application</button>
        <button type="reset">Reset Form</button>

    </form>

</body>
</html>
